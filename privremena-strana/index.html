*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0a0d1a;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;
 background-image:radial-gradient(60% 50% at 50% 0%,#e879c922,transparent 70%),radial-gradient(50% 40% at 85% 100%,#c04fe818,transparent 70%)}
.lang{position:absolute;top:20px;right:20px;display:flex;gap:6px}
.lang button{font:inherit;font-size:14px;color:#c9cde6;background:transparent;border:1px solid #2c3254;border-radius:999px;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed=true]{background:#141831;color:#fff;border-color:#5a5f86}
.lang button:focus-visible,.lang button:hover{border-color:#e879c9;outline:none}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 20px 32px;gap:28px}
.logo{width:min(300px,62vw);height:auto;filter:drop-shadow(0 0 28px #e879c944)}
h1{font-family:MA,system-ui,sans-serif;font-weight:600;font-size:clamp(34px,7vw,68px);line-height:1.08;letter-spacing:-.01em}
h1 span{background:linear-gradient(90deg,#e879c9,#c04fe8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(16px,2.4vw,20px);color:#aab0cf;max-width:34em;line-height:1.5}
.cd{display:flex;gap:clamp(8px,2vw,18px);justify-content:center;margin-top:6px}
.cd div{background:#141831;border:1px solid #2c3254;border-radius:18px;min-width:clamp(66px,17vw,112px);padding:clamp(12px,2.4vw,20px) 6px}
.cd b{display:block;font-family:MA,system-ui,sans-serif;font-weight:600;font-size:clamp(30px,8vw,56px);line-height:1;font-variant-numeric:tabular-nums}
.cd small{display:block;margin-top:8px;font-size:clamp(11px,2.4vw,14px);color:#9aa1bd;letter-spacing:.06em;text-transform:uppercase}
.when{font-size:15px;color:#9aa1bd}
.done .cd,.done .when{display:none}
footer{padding:20px;text-align:center;font-size:13px;color:#6f769a}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .6s ease both}main>*:nth-child(2){animation-delay:.08s}main>*:nth-child(3){animation-delay:.16s}main>*:nth-child(4){animation-delay:.24s}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
